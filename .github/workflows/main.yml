name: Tusher Bot Runner

on:
  push:
    branches: [ "main" ]
  schedule:
    # প্রতি ৫ ঘণ্টা পর পর অ্যাকশন নতুন করে ট্রিগার হবে যাতে ক্র্যাশ না করে
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot in Continuous Loop
        run: |
          while true; do
            echo "Starting Bot..."
            node index.js
            echo "Bot stopped/crashed. Restarting in 5 seconds..."
            sleep 5
          done
